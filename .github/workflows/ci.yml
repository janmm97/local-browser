name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        # shortcut: no macOS, hosted macOS runners often never pick up the job; add it back when they're reliable
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      # GitHub-hosted runners ship Google Chrome; tests drive it headless.
      - run: npm test
      - run: npm run build
